# Déploiement de production : application + Caddy (HTTPS automatique Let's Encrypt).
# Préalable : npm run configurer -- votre-domaine.fr   (crée le fichier .env)
# Démarrage : docker compose up -d --build
name: compta

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/compta.db
      BACKUP_DIR: /app/sauvegardes
      NPM_CONFIG_CACHE: /tmp/.npm
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - donnees:/app/data
      - sauvegardes:/app/sauvegardes
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAINE: ${DOMAINE:?Lancez d'abord npm run configurer -- votre-domaine.fr}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }

volumes:
  donnees:
  sauvegardes:
  caddy_data:
  caddy_config:
