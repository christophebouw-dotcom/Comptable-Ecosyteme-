name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage strict
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilation de l'interface
        run: npm run build
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
